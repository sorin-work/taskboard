name: taskboard

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5444}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskboard -d taskboard']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=taskboard;Username=taskboard;Password=taskboard
      Jwt__Secret: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
      App__PublicUrl: http://localhost:${WEB_PORT:-5184}
      # Applies EF Core migrations every time the container starts.
      Database__MigrateOnStartup: 'true'
      # nginx sets X-Forwarded-For. Don't enable this if the api is exposed
      # directly to untrusted clients.
      ForwardedHeaders__Enabled: 'true'
      # Creates demo@example.com / demo-password with sample workspaces.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${API_PORT:-4404}:8080'
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /api/health HTTP/1.0\r\n\r\n" >&3 && grep -q "200 OK" <&3',
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-5184}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
