log_format main_with_id '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                        '$request_time "$http_user_agent" request_id=$request_id';

server {
    listen 80;
    access_log /var/log/nginx/access.log main_with_id;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same id in the nginx access log and the api's logs.
        proxy_set_header X-Request-Id $request_id;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes all serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
